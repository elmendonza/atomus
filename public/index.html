<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1A73E8" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Atomus" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* html/body travados exatamente nas bordas da tela visível via
         position: fixed + inset: 0, em vez de depender de 100%/100vh/100dvh
         (que em alguns iPhones, rodando como app salvo na tela de início,
         não preenchem a altura real e deixam uma faixa em branco embaixo). */
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      body {
        overflow: hidden;
        position: fixed;
        inset: 0;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        position: absolute;
        inset: 0;
        flex: 1;
      }

      /* O Safari do iPhone força zoom ao focar um campo com fonte menor que
         16px, mesmo com o zoom manual desativado no viewport. Os campos do
         app usam 15px, então garantimos 16px aqui pra esse gatilho nunca
         disparar (a diferença visual é imperceptível). */
      input,
      textarea,
      select {
        font-size: 16px !important;
      }

      /* Tela de carregamento mostrada até o React montar: logo do Atomus com as bolinhas girando (SVG animado,
         idêntico ao components/loading-screen.tsx, que assume a animação sem "pulo"). */
      .carregamento-inicial {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- O React substitui esse conteúdo assim que monta. -->
    <div id="root">
      <div class="carregamento-inicial">
        <svg width="260" height="260" viewBox="0 0 260 260" role="img" aria-label="Carregando Atomus">
        <g transform="translate(130,130)">
          <g transform="rotate(0)"><ellipse rx="105" ry="37" fill="none" stroke="#1c1c1e" stroke-width="4" /></g>
          <g transform="rotate(90)"><ellipse rx="105" ry="37" fill="none" stroke="#1c1c1e" stroke-width="4" /></g>
          <g transform="rotate(45)"><ellipse rx="105" ry="37" fill="none" stroke="#1c1c1e" stroke-width="4" /></g>
          <g transform="rotate(135)"><ellipse rx="105" ry="37" fill="none" stroke="#1c1c1e" stroke-width="4" /></g>
          <g transform="rotate(0)"><circle r="6.5" fill="#1c1c1e"><animateMotion dur="4s" begin="-1.0s" repeatCount="indefinite" path="M 105,0 A 105,37 0 1,1 -105,0 A 105,37 0 1,1 105,0 Z" /></circle></g>
          <g transform="rotate(90)"><circle r="6.5" fill="#1c1c1e"><animateMotion dur="5s" begin="-3.0s" repeatCount="indefinite" path="M 105,0 A 105,37 0 1,1 -105,0 A 105,37 0 1,1 105,0 Z" /></circle></g>
          <g transform="rotate(45)"><circle r="6.5" fill="#1c1c1e"><animateMotion dur="6s" begin="-0.6s" repeatCount="indefinite" path="M 105,0 A 105,37 0 1,1 -105,0 A 105,37 0 1,1 105,0 Z" /></circle></g>
          <g transform="rotate(45)"><circle r="6.5" fill="#1c1c1e"><animateMotion dur="6s" begin="-3.6s" repeatCount="indefinite" path="M 105,0 A 105,37 0 1,1 -105,0 A 105,37 0 1,1 105,0 Z" /></circle></g>
          <g transform="rotate(135)"><circle r="6.5" fill="#1c1c1e"><animateMotion dur="5s" begin="-1.75s" repeatCount="indefinite" path="M 105,0 A 105,37 0 1,1 -105,0 A 105,37 0 1,1 105,0 Z" /></circle></g>
          <g transform="rotate(135)"><circle r="6.5" fill="#1c1c1e"><animateMotion dur="5s" begin="-4.25s" repeatCount="indefinite" path="M 105,0 A 105,37 0 1,1 -105,0 A 105,37 0 1,1 105,0 Z" /></circle></g>
        </g>
        </svg>
      </div>
    </div>
    </body>
</html>
