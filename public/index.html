    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* html/body travados exatamente nas bordas da tela visível via
         position: fixed + inset: 0, em vez de depender de 100%/100vh/100dvh
         (que em alguns iPhones, rodando como app salvo na tela de início,
         não preenchem a altura real e deixam uma faixa em branco embaixo). */
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      body {
        overflow: hidden;
        position: fixed;
        inset: 0;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        position: absolute;
        inset: 0;
        flex: 1;
      }

      /* O Safari do iPhone força zoom ao focar um campo com fonte menor que
         16px, mesmo com o zoom manual desativado no viewport. Os campos do
         app usam 15px, então garantimos 16px aqui pra esse gatilho nunca
         disparar (a diferença visual é imperceptível). */
      input,
      textarea,
      select {
        font-size: 16px !important;
      }

      /* Logo do Atomus animado só com transforms CSS (roda fora do thread do JS, então não engasga enquanto o app carrega).
         Mesma estrutura do components/atomus-orbitas.web.tsx, que assume a animação sem "pulo". */
      .carregamento-inicial {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
      }
      @keyframes orb-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
