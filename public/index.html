<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1A73E8" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Atomus" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* html/body travados exatamente nas bordas da tela visível via
         position: fixed + inset: 0, em vez de depender de 100%/100vh/100dvh
         (que em alguns iPhones, rodando como app salvo na tela de início,
         não preenchem a altura real e deixam uma faixa em branco embaixo). */
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      body {
        overflow: hidden;
        position: fixed;
        inset: 0;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        position: absolute;
        inset: 0;
        flex: 1;
      }

      /* O Safari do iPhone força zoom ao focar um campo com fonte menor que
         16px, mesmo com o zoom manual desativado no viewport. Os campos do
         app usam 15px, então garantimos 16px aqui pra esse gatilho nunca
         disparar (a diferença visual é imperceptível). */
      input,
      textarea,
      select {
        font-size: 16px !important;
      }

      /* Tela de carregamento estática, mostrada só até o React montar (que
         então substitui o conteúdo de #root pela versão animada de verdade). */
      .carregamento-inicial {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .carregamento-logo {
        width: 72px;
        height: 72px;
        border-radius: 36px;
        background: #ffffff;
        border: 1px solid #e8eaed;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .carregamento-logo img {
        width: 50px;
        height: 50px;
      }
      .carregamento-titulo {
        font-size: 22px;
        font-weight: 700;
        color: #202124;
      }
      .carregamento-anel {
        position: relative;
        width: 44px;
        height: 44px;
        margin-top: 8px;
        animation: carregamento-girar 1s linear infinite;
      }
      .carregamento-ponto {
        position: absolute;
        top: 19px;
        left: 19px;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #1a73e8;
      }
      @keyframes carregamento-girar {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- O React substitui esse conteúdo assim que monta. -->
    <div id="root">
      <div class="carregamento-inicial">
        <div class="carregamento-logo">
          <img src="/icon.png" alt="Atomus" />
        </div>
        <div class="carregamento-titulo">Atomus</div>
        <div class="carregamento-anel">
          <div class="carregamento-ponto" style="opacity: 1; transform: rotate(0deg) translate(22px);"></div>
          <div class="carregamento-ponto" style="opacity: 0.85; transform: rotate(45deg) translate(22px);"></div>
          <div class="carregamento-ponto" style="opacity: 0.72; transform: rotate(90deg) translate(22px);"></div>
          <div class="carregamento-ponto" style="opacity: 0.58; transform: rotate(135deg) translate(22px);"></div>
          <div class="carregamento-ponto" style="opacity: 0.45; transform: rotate(180deg) translate(22px);"></div>
          <div class="carregamento-ponto" style="opacity: 0.32; transform: rotate(225deg) translate(22px);"></div>
          <div class="carregamento-ponto" style="opacity: 0.19; transform: rotate(270deg) translate(22px);"></div>
          <div class="carregamento-ponto" style="opacity: 0.15; transform: rotate(315deg) translate(22px);"></div>
        </div>
      </div>
    </div>
  </body>
</html>
